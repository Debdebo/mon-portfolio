<title>Perspectives – DH Formation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e8d8d0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }

  .stage {
    position: relative;
    width: 768px;
    height: 512px;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .slide.active { opacity: 1; }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Indicateurs */
  .dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    transition: background 0.4s, transform 0.4s;
  }
  .dot.active {
    background: rgba(255,255,255,0.95);
    transform: scale(1.3);
  }
</style>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.dot');
  // Durées par slide (ms) avant transition vers la suivante
  const holds  = [2200, 1800, 1600, 3000];
  let current  = 0;
  let timer;

  function goTo(next) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = next % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
    timer = setTimeout(() => goTo(current + 1), holds[current]);
  }

  // Démarrage
  timer = setTimeout(() => goTo(1), holds[0]);
</script>
